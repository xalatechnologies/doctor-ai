global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'doctor-ai'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'symptom-analysis'
    static_configs:
      - targets: ['symptom-analysis:3001']
    metrics_path: '/metrics'
    scheme: 'http' 