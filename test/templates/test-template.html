<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        .section {
            margin-bottom: 20px;
        }
        .section-heading {
            color: #333;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .content {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>{{title}}</h1>
    {{#sections}}
    <div class="section">
        <h2 class="section-heading">{{heading}}</h2>
        <div class="content" style="font-size: {{style.fontSize}}px; color: {{style.fontColor}};">
            {{content}}
        </div>
    </div>
    {{/sections}}
</body>
</html>
