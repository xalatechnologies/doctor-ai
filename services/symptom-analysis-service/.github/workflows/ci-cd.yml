name: Symptom Analysis Service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'services/symptom-analysis-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/symptom-analysis-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: services/symptom-analysis-service/package-lock.json

    - name: Install dependencies
      working-directory: services/symptom-analysis-service
      run: npm ci

    - name: Run linter
      working-directory: services/symptom-analysis-service
      run: npm run lint

    - name: Run unit tests
      working-directory: services/symptom-analysis-service
      run: npm run test

    - name: Run integration tests
      working-directory: services/symptom-analysis-service
      run: npm run test:integration

    - name: Run e2e tests
      working-directory: services/symptom-analysis-service
      run: npm run test:e2e

    - name: Run performance tests
      working-directory: services/symptom-analysis-service
      run: npm run test:performance

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: services/symptom-analysis-service
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/symptom-analysis-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/symptom-analysis-service:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/symptom-analysis-service:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/symptom-analysis-service:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update ECS service
      run: |
        aws ecs update-service \
          --cluster doctor-ai-cluster \
          --service symptom-analysis-service \
          --force-new-deployment

    - name: Wait for ECS deployment
      run: |
        aws ecs wait services-stable \
          --cluster doctor-ai-cluster \
          --services symptom-analysis-service

  notify:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Notify Slack on success
      if: success()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: deployments
        SLACK_COLOR: good
        SLACK_MESSAGE: 'Symptom Analysis Service deployed successfully :rocket:'
        SLACK_TITLE: Deployment Success

    - name: Notify Slack on failure
      if: failure()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_CHANNEL: deployments
        SLACK_COLOR: danger
        SLACK_MESSAGE: 'Symptom Analysis Service deployment failed :x:'
        SLACK_TITLE: Deployment Failure 